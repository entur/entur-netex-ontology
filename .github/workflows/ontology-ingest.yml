name: ontology-ingest

# Sporer oppstrøms nordic-netex-ontology (main) og åpner PR når submodul-pinnen
# flytter seg. Entur-ontologien bygger PÅ det nordiske fundamentet — en
# oppstrøms-endring er et signal om at Entur-lagene kan trenge oppdatering.
#
# En differensiell referanse-integritetssjekk avgjør ruten: bryter bumpen INGEN
# eksisterende kobling (kun tightening / additive endringer) aktiveres auto-merge
# på PR-en (full sporbarhet). Forsvinner en referert klasse/property blir PR-en
# holdt tilbake for menneskelig gjennomgang. Fail-safe: enhver feil = ingen
# auto-merge.
#
# Kjøres 05:45 UTC, altså noen minutter FØR nordic-netex-documentation sin
# ontology-ingest (06:00 UTC). Slik rekker pinnen her å flytte seg først, så
# dokumentasjonsjobben plukker opp den ferske nordic-pinnen samme natt.

on:
  schedule:
    # Hver dag 05:45 UTC — bevisst litt før dokumentasjonsjobben (06:00 UTC).
    - cron: "45 5 * * *"
  workflow_dispatch: {}

# Én kjøring om gangen; ny natt oppdaterer samme PR-branch fremfor å lage duplikat.
concurrency:
  group: ontology-ingest
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  # labels settes via Issues API av create-pull-request
  issues: write
  # bot-PR-en trigger ikke validate-workflowen (GITHUB_TOKEN), så vi rapporterer
  # den påkrevde "validate"-statusen selv basert på coupling-resultatet.
  statuses: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Noter gammel pin
        id: before
        run: echo "sha=$(git -C nordic-netex-ontology rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Hent siste oppstrøms main
        # --remote flytter pinnen til origin/main (branch=main i .gitmodules).
        # --init i samme kommando; et separat --init uten --remote ville satt
        # submodulen tilbake til den gamle pinnen i superprojectet.
        run: git submodule update --remote --init nordic-netex-ontology

      - name: Noter ny pin
        id: after
        run: echo "sha=$(git -C nordic-netex-ontology rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Flyttet pinnen seg?
        id: diff
        run: |
          if git diff --quiet --ignore-submodules=dirty; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Ingen oppstrøms-endring — pinnen står stille."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Valider koblinger (differensielt)
        id: validate
        if: steps.diff.outputs.changed == 'true'
        env:
          OLD_SHA: ${{ steps.before.outputs.sha }}
          NEW_SHA: ${{ steps.after.outputs.sha }}
        run: |
          python3 -m pip install --quiet rdflib
          # Ny pin er allerede sjekket ut — mål dangling nå, så mot gammel pin.
          python3 scripts/validate_couplings.py | sort > "$RUNNER_TEMP/dangling_new.txt" || true
          git -C nordic-netex-ontology checkout --quiet "$OLD_SHA"
          python3 scripts/validate_couplings.py | sort > "$RUNNER_TEMP/dangling_old.txt" || true
          git -C nordic-netex-ontology checkout --quiet "$NEW_SHA"
          newly="$(comm -13 "$RUNNER_TEMP/dangling_old.txt" "$RUNNER_TEMP/dangling_new.txt")"
          if [ -z "$newly" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "Ingen nye brutte koblinger — bumpen er trygg."
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            { echo "newly<<EOF"; echo "$newly"; echo "EOF"; } >> "$GITHUB_OUTPUT"
            echo "Nye brutte koblinger:"; echo "$newly"
          fi

      - name: Bygg PR-tekst
        id: body
        if: steps.diff.outputs.changed == 'true'
        env:
          OLD_SHA: ${{ steps.before.outputs.sha }}
          NEW_SHA: ${{ steps.after.outputs.sha }}
          OK: ${{ steps.validate.outputs.ok }}
          NEWLY: ${{ steps.validate.outputs.newly }}
        run: |
          BODY="$RUNNER_TEMP/pr-body.md"
          {
            echo "Oppstrøms [\`nordic-netex-ontology\`](https://github.com/entur/nordic-netex-ontology) (main) har fått nye commits, og submodul-pinnen i dette repoet er flyttet fremover."
            echo ""
            echo "**Pin:** \`${OLD_SHA:0:12}\` → \`${NEW_SHA:0:12}\`"
            echo ""
            echo "**Oppstrøms-diff:** https://github.com/entur/nordic-netex-ontology/compare/${OLD_SHA}...${NEW_SHA}"
            echo ""
            echo "---"
            if [ "$OK" = "true" ]; then
              echo "✅ **Koblinger validert:** ingen refererte klasser/properties forsvant oppstrøms (tightening/additive endringer slipper gjennom). Auto-merge aktivert."
            else
              echo "⛔ **Brutte koblinger — krever gjennomgang.** Følgende refererte termer er ikke lenger definert i det nordiske fundamentet:"
              echo ""
              echo '```'
              echo "$NEWLY"
              echo '```'
            fi
          } > "$BODY"
          echo "path=$BODY" >> "$GITHUB_OUTPUT"

      - name: Opprett/oppdater karantene-PR
        id: cpr
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6.1.0
        with:
          base: main
          branch: ontology-ingest/upstream
          commit-message: "chore(ontology): bump nordic-netex-ontology til oppstrøms main"
          title: "[oppstrøms] nordic-netex-ontology har flyttet seg — sjekk om Entur-lagene må oppdateres"
          body-path: ${{ steps.body.outputs.path }}
          labels: |
            ontology
            automated
            ${{ steps.validate.outputs.ok == 'true' && 'auto-merge' || 'needs-review' }}
          delete-branch: true

      - name: Rapporter "validate"-status på bot-PR (kobling = gate)
        if: steps.diff.outputs.changed == 'true' && steps.cpr.outputs.pull-request-head-sha
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.cpr.outputs.pull-request-head-sha }}
          OK: ${{ steps.validate.outputs.ok }}
        run: |
          state=$([ "$OK" = "true" ] && echo success || echo failure)
          gh api --method POST "repos/${{ github.repository }}/statuses/$SHA" \
            -f state="$state" \
            -f context="validate" \
            -f description="coupling gate: ok=$OK"

      - name: Aktiver auto-merge (grønt)
        if: steps.diff.outputs.changed == 'true' && steps.validate.outputs.ok == 'true' && steps.cpr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge --auto --squash "${{ steps.cpr.outputs.pull-request-number }}"
