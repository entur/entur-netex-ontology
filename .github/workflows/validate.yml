name: validate

# PR-gate: hver .ttl må parse som gyldig Turtle før merge. Dette er checken et
# ruleset på main kan kreve. Coupling-sjekken bor bevisst i ontology-ingest
# (differensiell mot submodul-pin), ikke her — en absolutt variant ville feilet
# på pre-eksisterende dangling referanser i den genererte basen.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          submodules: recursive

      - name: Parse alle Entur-lag (.ttl)
        run: |
          python3 -m pip install --quiet rdflib
          python3 scripts/validate_ttl.py netex-entur*.ttl

      - name: Valider profilinheritance og effektiv allowlist
        run: python3 scripts/validate_profile_inheritance.py

      # Genererte shapes må være i takt med medlemskapet, og ingen
      # håndskrevet shape får telle et felt som allerede genereres.
      - name: Genererte Entur-shapes er oppdatert
        run: >-
          python3 nordic-netex-ontology/scripts/generate-shapes.py --check
          --layer ../netex-entur.ttl --namespace https://entur.org/ontology#
          --prefix entur --ontology https://entur.org/ontology/shapes
          --out ../netex-entur-shapes.ttl
